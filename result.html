<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>当直表の結果</title>
    <script src="https://unpkg.com/exceljs/dist/exceljs.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 8px; font-size: 12px; overflow: auto; }
        #filepath { font-size: 11px; color: #555; margin-bottom: 6px; word-break: break-all; }
        table { border-collapse: collapse; white-space: nowrap; }
        td { border: 1px solid #ccc; padding: 2px 5px; text-align: center; min-width: 28px; }
        tr:first-child td { background: #f0f0f0; font-weight: bold; position: sticky; top: 0; }
        td:first-child { background: #e8e8e8; font-weight: bold; position: sticky; left: 0; }
    </style>
</head>
<body>
    <div id="filepath">読み込み中...</div>
    <div id="table-area"></div>
    <script>
        function cellText(cell) {
            const v = cell.value;
            if (v === null || v === undefined) return '';
            if (typeof v === 'object') {
                if (v.richText) return v.richText.map(r => r.text ?? '').join('');
                if (v.result !== undefined) return String(v.result ?? '');
            }
            return String(v);
        }
        function esc(s) {
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        async function loadResult() {
            const filePath = await window.api.getResultFile();
            if (!filePath) {
                document.getElementById('filepath').textContent = 'ファイルパスが取得できませんでした。';
                return;
            }
            document.title = '当直表の結果 - ' + filePath.split(/[\\/]/).pop();
            document.getElementById('filepath').textContent = filePath;

            const base64 = await window.api.readFileBase64(filePath);
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

            const workbook = new ExcelJS.Workbook();
            await workbook.xlsx.load(bytes.buffer);
            const ws = workbook.worksheets[0];
            if (!ws) { document.getElementById('filepath').textContent += ' ← シートが見つかりません'; return; }

            let html = '<table>';
            for (let r = 1; r <= ws.rowCount; r++) {
                html += '<tr>';
                for (let c = 1; c <= ws.columnCount; c++) {
                    html += `<td>${esc(cellText(ws.getRow(r).getCell(c)))}</td>`;
                }
                html += '</tr>';
            }
            html += '</table>';
            document.getElementById('table-area').innerHTML = html;
        }

        loadResult();
    </script>
</body>
</html>
