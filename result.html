<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>当直表の結果</title>
    <script src="https://unpkg.com/exceljs/dist/exceljs.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 8px; font-size: 12px; overflow: auto; }
        table { border-collapse: collapse; white-space: nowrap; }
        td {
            border: 1px solid #ddd;
            padding: 2px 3px;
            text-align: center;
            min-width: 22px;
        }
        /* sticky 用クラス（背景は JS でインライン指定） */
        .sh { position: sticky; top: 0; z-index: 2; }
        .sl { position: sticky; left: 0; z-index: 1; }
        .sc { position: sticky; top: 0; left: 0; z-index: 3; }
        #table-area td { -webkit-user-select: none; user-select: none; cursor: default; }
        td.sel { outline: 2px solid #1a73e8; outline-offset: -2px; }
        #table-area td[contenteditable] { user-select: text; cursor: text; outline: 2px solid #34a853; outline-offset: -2px; }
        #toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        #save-btn { padding: 3px 14px; font-size: 12px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="toolbar">
        <button id="save-btn">保存</button>
        <span id="score-info" style="font-size: 11px; color: #444; white-space: pre;"></span>
    </div>
    <div id="table-area"></div>
    <script>
        let _workbook = null;
        let _ws = null;
        let _filePath = null;
        const SKIP_ROWS = new Set(['start', 'end', '']);

        document.getElementById('save-btn').addEventListener('click', async () => {
            if (!_filePath) return;

            // 元ファイルを再読み込みして新鮮なワークブックを作成
            const base64src = await window.api.readFileBase64(_filePath);
            const binSrc = atob(base64src);
            const bytesSrc = new Uint8Array(binSrc.length);
            for (let i = 0; i < binSrc.length; i++) bytesSrc[i] = binSrc.charCodeAt(i);
            const wb = new ExcelJS.Workbook();
            await wb.xlsx.load(bytesSrc.buffer);
            const ws = wb.worksheets[0];

            // 編集済みセルをワークブックに反映（data-r/data-c は元ファイルの行番号）
            document.querySelectorAll('#table-area td[data-r][data-c]').forEach(td => {
                const cell = ws.getCell(+td.dataset.r, +td.dataset.c);
                if (cell.type !== ExcelJS.ValueType.Formula) {
                    cell.value = td.textContent;
                }
            });

            // start/end 行を削除（後ろから削除して行番号ずれを防ぐ）
            const rowsToDelete = [];
            for (let r = 1; r <= ws.rowCount; r++) {
                const l1 = cellText(ws.getRow(r).getCell(1));
                if (SKIP_ROWS.has(l1)) rowsToDelete.push(r);
            }
            for (let i = rowsToDelete.length - 1; i >= 0; i--) {
                ws.spliceRows(rowsToDelete[i], 1);
            }

            // spliceRows 後の処理（祝日行挿入 + 年月書き込み）
            const meta = window.api.getResultMeta ? await window.api.getResultMeta() : null;
            if (meta && meta.year && meta.month) {
                // 曜日行と日付行の位置を特定
                let weekdayRowIdx = -1, dateRowIdx = -1;
                for (let r = 1; r <= ws.rowCount; r++) {
                    const lbl = cellText(ws.getRow(r).getCell(1));
                    if (lbl === '曜日' && weekdayRowIdx < 0) weekdayRowIdx = r;
                    if (lbl === '日'   && dateRowIdx   < 0) dateRowIdx   = r;
                }
                // 曜日行の直後に祝日行を挿入（スタイルは曜日行からコピー）
                if (weekdayRowIdx > 0 && dateRowIdx > 0) {
                    ws.spliceRows(weekdayRowIdx + 1, 0, []);
                    const hRow   = ws.getRow(weekdayRowIdx + 1); // 新しい祝日行
                    const srcRow = ws.getRow(weekdayRowIdx);      // 曜日行（スタイルコピー元）
                    const dayCache = {};
                    for (let c = 1; c <= ws.columnCount; c++) {
                        const srcCell = srcRow.getCell(c);
                        const dstCell = hRow.getCell(c);
                        // 塗りつぶし・罫線・整列・フォントを曜日行からコピー
                        if (srcCell.fill)      dstCell.fill      = srcCell.fill;
                        if (srcCell.border)    dstCell.border    = srcCell.border;
                        if (srcCell.alignment) dstCell.alignment = srcCell.alignment;
                        if (srcCell.font)      dstCell.font      = srcCell.font;
                        // 値を設定
                        if (c === 1) {
                            dstCell.value = '祝日';
                        } else {
                            const day = parseInt(cellText(ws.getRow(dateRowIdx).getCell(c)));
                            if (!isNaN(day) && day >= 1 && day <= 31) {
                                if (!(day in dayCache)) {
                                    const dt = new Date(meta.year, meta.month - 1, day);
                                    dayCache[day] = await window.api.getHolidayName(dt.toISOString()) || '';
                                }
                                if (dayCache[day]) dstCell.value = dayCache[day];
                            }
                        }
                    }
                }
                // 左上セル(A1)に年月を書き込む
                ws.getCell(1, 1).value = `${meta.year}年${meta.month}月`;
            }

            const buffer = await wb.xlsx.writeBuffer();
            const uint8 = new Uint8Array(buffer);
            let binary = '';
            for (let i = 0; i < uint8.length; i += 8192) {
                binary += String.fromCharCode(...uint8.subarray(i, i + 8192));
            }
            const base64 = btoa(binary);
            const savePath = await window.api.showSaveDialog(_filePath);
            if (!savePath) return;
            await window.api.saveFile(savePath, base64);
        });

        function cellText(cell) {
            const v = cell.value;
            if (v === null || v === undefined) return '';
            if (typeof v === 'object') {
                if (v.richText) return v.richText.map(r => r.text ?? '').join('');
                if (v.result !== undefined) return String(v.result ?? '');
                if (v.text !== undefined) return String(v.text);
            }
            return String(v);
        }
        function esc(s) {
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // メインアプリと同じカラーパレット
        const COLOR = {
            headerBg:    '#f0f0f0',
            labelOdd:    '#f5f5f5',
            labelEven:   '#e5e5e5',
            weekendOdd:  '#fff2f2',
            weekendEven: '#ffe5e5',
            weekdayOdd:  '#ffffe0',
            weekdayEven: '#fffacd',
        };

        // 曜日行のラベルから週末判定
        const WEEKEND = new Set(['土', '日', '祝']);

        // ヘッダー行（人名データではない行）のラベル
        const HEADER_LABELS = new Set(['', '応援医師', '日', '曜日', 'start', 'end']);

        async function loadResult() {
            const filePath = await window.api.getResultFile();
            if (!filePath) {
                document.getElementById('score-info').textContent = 'ファイルパスが取得できませんでした。';
                return;
            }
            _filePath = filePath;
            document.title = '当直表の結果 - ' + filePath.split(/[\\/]/).pop();

            const base64 = await window.api.readFileBase64(filePath);
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

            _workbook = new ExcelJS.Workbook();
            await _workbook.xlsx.load(bytes.buffer);
            const workbook = _workbook;
            _ws = workbook.worksheets[0];
            const ws = _ws;
            if (!ws) {
                document.getElementById('score-info').textContent = 'シートが見つかりません';
                return;
            }

            const nRows = ws.rowCount;
            // 1行目の非空セルの末尾を実際の列数とする（空白列を除外）
            let nCols = 1;
            const headerRow = ws.getRow(1);
            for (let c = 1; c <= ws.columnCount; c++) {
                if (cellText(headerRow.getCell(c)) !== '') nCols = c;
            }

            // ── 曜日行を探してカラムごとの色を決定 ──────────────────────
            const colIsWeekend = {}; // ExcelJS 1-based col index → boolean
            for (let r = 1; r <= nRows; r++) {
                if (cellText(ws.getRow(r).getCell(1)) === '曜日') {
                    for (let c = 2; c <= nCols; c++) {
                        colIsWeekend[c] = WEEKEND.has(cellText(ws.getRow(r).getCell(c)));
                    }
                    break;
                }
            }

            // ── 日付行から日番号を収集し祝日名を取得 ─────────────────────────
            const colDateNum = {}; // c (1-based) → 日番号
            for (let r = 1; r <= nRows; r++) {
                if (cellText(ws.getRow(r).getCell(1)) === '日') {
                    for (let c = 2; c <= nCols; c++) {
                        const d = parseInt(cellText(ws.getRow(r).getCell(c)));
                        if (!isNaN(d) && d >= 1 && d <= 31) colDateNum[c] = d;
                    }
                    break;
                }
            }
            const colHoliday = {}; // c (1-based) → 祝日名（なければ ''）
            const _meta = window.api.getResultMeta ? await window.api.getResultMeta() : null;
            if (_meta && _meta.score) {
                document.getElementById('score-info').textContent = _meta.score;
            }
            if (_meta && _meta.year && _meta.month) {
                const dayCache = {};
                for (const [cStr, d] of Object.entries(colDateNum)) {
                    if (!(d in dayCache)) {
                        const dt = new Date(_meta.year, _meta.month - 1, d);
                        dayCache[d] = await window.api.getHolidayName(dt.toISOString()) || '';
                    }
                    colHoliday[+cStr] = dayCache[d];
                }
            }

            // ── 名前列の最大幅を事前スキャン ────────────────────────────────
            let maxNameLen = 0;
            for (let r = 1; r <= nRows; r++) {
                const len = cellText(ws.getRow(r).getCell(1)).length;
                if (len > maxNameLen) maxNameLen = len;
            }
            const nameColMinWidth = Math.max(60, maxNameLen * 14 + 10);

            // ── HTML テーブルを組み立て ───────────────────────────────────
            let html = '<table>';
            let pIdx = 0; // 人名行のカウント（偶奇で色を変える）

            for (let r = 1; r <= nRows; r++) {
                const rowLabel  = cellText(ws.getRow(r).getCell(1));
                if (SKIP_ROWS.has(rowLabel)) continue;
                const isHeader = HEADER_LABELS.has(rowLabel);
                const isFirstRow = (r === 1);

                html += '<tr>';
                for (let c = 1; c <= nCols; c++) {
                    const val = esc(cellText(ws.getRow(r).getCell(c)));

                    let bg, cls;

                    if (isFirstRow && c === 1) {
                        cls = 'sc'; bg = COLOR.headerBg;
                    } else if (isFirstRow) {
                        cls = 'sh'; bg = COLOR.headerBg;
                    } else if (c === 1) {
                        cls = 'sl';  // 名前列を sticky left
                        bg = isHeader ? COLOR.headerBg
                                      : (pIdx % 2 === 0 ? COLOR.labelOdd : COLOR.labelEven);
                    } else if (c === 2) {
                        cls = '';  // 当直回数列はヘッダーではない
                        bg = isHeader ? COLOR.headerBg
                                      : (pIdx % 2 === 0 ? COLOR.weekdayOdd : COLOR.weekdayEven);
                    } else if (isHeader) {
                        cls = ''; bg = COLOR.headerBg;
                    } else {
                        cls = '';
                        const we = colIsWeekend[c] ?? false;
                        bg = we
                            ? (pIdx % 2 === 0 ? COLOR.weekendOdd  : COLOR.weekendEven)
                            : (pIdx % 2 === 0 ? COLOR.weekdayOdd  : COLOR.weekdayEven);
                    }

                    const widthStyle = c === 1 ? `;min-width:${nameColMinWidth}px` : '';
                    html += `<td class="${cls}" style="background:${bg}${widthStyle}" data-r="${r}" data-c="${c}">${val}</td>`;
                }
                html += '</tr>';

                // '曜日'行の直後に祝日行を動的挿入（Excelには存在しないので data-r/data-c なし）
                if (rowLabel === '曜日') {
                    html += '<tr>';
                    for (let c = 1; c <= nCols; c++) {
                        const v = c === 1 ? '祝日' : esc(colHoliday[c] || '');
                        const cls = c === 1 ? 'sl' : '';
                        const wStyle = c === 1 ? `;min-width:${nameColMinWidth}px` : '';
                        html += `<td class="${cls}" style="background:${COLOR.headerBg}${wStyle}">${v}</td>`;
                    }
                    html += '</tr>';
                }

                if (!isHeader && !isFirstRow) pIdx++;
            }

            html += '</table>';
            document.getElementById('table-area').innerHTML = html;

            // テーブル全体が収まるようウィンドウサイズを自動調整
            await new Promise(r => requestAnimationFrame(r));
            const tbl = document.querySelector('#table-area table');
            if (tbl && window.api.resizeWindow) {
                const toolbarH  = document.getElementById('toolbar').offsetHeight;
                const bodyPad   = 8 * 2; // padding: 8px top+bottom
                const gaps      = 4;     // toolbar margin-bottom
                const totalW    = tbl.offsetWidth  + bodyPad;
                const totalH    = toolbarH + gaps + tbl.offsetHeight + bodyPad;
                const sw = window.screen.availWidth;
                const sh = window.screen.availHeight;
                window.api.resizeWindow(
                    Math.min(Math.max(totalW, 400), sw - 40),
                    Math.min(Math.max(totalH, 200), sh - 80)
                );
            }

            // ── セル選択 & TSV コピー ──────────────────────────────────────
            let anchor = null;
            let focus  = null;

            function normSel() {
                if (!anchor || !focus) return null;
                return {
                    r1: Math.min(anchor.r, focus.r), r2: Math.max(anchor.r, focus.r),
                    c1: Math.min(anchor.c, focus.c), c2: Math.max(anchor.c, focus.c),
                };
            }

            function updateHighlight() {
                const sel = normSel();
                document.querySelectorAll('#table-area td').forEach(td => {
                    const r = +td.dataset.r, c = +td.dataset.c;
                    const inside = sel && r >= sel.r1 && r <= sel.r2 && c >= sel.c1 && c <= sel.c2;
                    td.classList.toggle('sel', inside);
                });
            }

            function clearEditable() {
                document.querySelectorAll('#table-area td[contenteditable]').forEach(t => t.removeAttribute('contenteditable'));
            }

            const tableEl = document.querySelector('#table-area table');
            tableEl.addEventListener('mousedown', e => {
                const td = e.target.closest('td');
                if (!td) return;
                clearEditable();
                anchor = focus = {r: +td.dataset.r, c: +td.dataset.c};
                updateHighlight();
                e.preventDefault();
            });
            tableEl.addEventListener('mouseover', e => {
                if (!anchor || !e.buttons) return;
                const td = e.target.closest('td');
                if (!td) return;
                focus = {r: +td.dataset.r, c: +td.dataset.c};
                updateHighlight();
            });
            tableEl.addEventListener('dblclick', e => {
                const td = e.target.closest('td');
                if (!td) return;
                anchor = focus = null;
                updateHighlight();
                clearEditable();
                td.setAttribute('contenteditable', 'true');
                td.focus();
                const range = document.createRange();
                range.selectNodeContents(td);
                const winSel = window.getSelection();
                winSel.removeAllRanges();
                winSel.addRange(range);
            });
            document.addEventListener('click', e => {
                if (!e.target.closest('#table-area')) {
                    anchor = focus = null;
                    updateHighlight();
                    clearEditable();
                }
            });
            document.addEventListener('copy', e => {
                if (document.querySelector('#table-area td[contenteditable]')) return; // 編集モードはネイティブコピー
                const sel = normSel();
                if (!sel) return;
                const rows = [];
                for (let r = sel.r1; r <= sel.r2; r++) {
                    const cols = [];
                    for (let c = sel.c1; c <= sel.c2; c++) {
                        const td = document.querySelector(`#table-area td[data-r="${r}"][data-c="${c}"]`);
                        cols.push(td ? td.textContent : '');
                    }
                    rows.push(cols.join('\t'));
                }
                e.clipboardData.setData('text/plain', rows.join('\r\n'));
                e.preventDefault();
            });
        }

        loadResult();

        document.addEventListener('wheel', (e) => {
            if (!e.ctrlKey) return;
            e.preventDefault();
            const delta = e.deltaY < 0 ? 0.1 : -0.1;
            const next = Math.min(Math.max(window.api.getZoomFactor() + delta, 0.5), 3.0);
            window.api.setZoomFactor(next);
        }, { passive: false });
    </script>
</body>
</html>
