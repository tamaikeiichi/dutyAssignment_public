<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>当直表作成</title>
    <link href="https://unpkg.com/tabulator-tables@6.3.0/dist/css/tabulator.min.css" rel="stylesheet">
    <script type="text/javascript" src="https://unpkg.com/tabulator-tables@6.3.0/dist/js/tabulator.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        h1 { margin-bottom: 10px; }
        p { margin-top: 0; }
        #open-file-button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 20px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
        }
        #open-file-button:hover { background-color: #e0e0e0; }

        /* 2. 表の見た目を調整（ボタンの下に配置） */
        #table-container { 
            margin: 20px auto; 
            border: 1px solid #333;
            max-width: 98vw; /* 画面幅いっぱいに */
        }
        /* --- ここから追加 --- */
        /* クリック（フォーカス）されたセルの色を変える */
        .tabulator-cell:focus {
            background-color: #e7f3ff !important; /* 薄い青 */
            outline: 2px solid #007bff !important; /* 濃い青の枠線 */
            outline-offset: -2px;
        }

        /* 選択された行の色を変える（selectable: 1 を設定している場合） */
        .tabulator-row.tabulator-selected {
            background-color: #f0f7ff !important;
        }
        /* --- ここまで追加 --- */
        /* マウスオーバー時の行の背景色変化（ハイライト）を無効化 */
        .tabulator-row.tabulator-selectable:hover {
            background-color: inherit !important;
            cursor: default;
        }

        /* ついでに、マウスオーバー時のセルの背景色変化も無効化（必要であれば） */
        .tabulator-cell:hover {
            background-color: inherit !important;
        }
        /* --- 土日・祝日の色分け設定 --- */
                
        /* --- 休日（赤系）の縞々設定 --- */
        /* 奇数行（または標準） */
        .sun-cell { 
            background-color: #fff2f2 !important; 
        }
        /* 偶数行（少し濃くする） */
        .tabulator-row:nth-child(even) .sun-cell {
            background-color: #ffe5e5 !important; 
        }

        /* --- 土曜（青系）の縞々設定 --- */
        /* 奇数行（または標準） */
        .sat-cell { 
            background-color: #fff2f2 !important; 
        }
        /* 偶数行（少し濃くする） */
        .tabulator-row:nth-child(even) .sat-cell {
            background-color: #ffe5e5 !important; 
        }

        /* --- 平日（薄黄色）の設定 --- */
        .weekday-cell {
            background-color: #ffffe0 !important; 
        }
        .tabulator-row:nth-child(even) .weekday-cell {
            background-color: #fffacd !important; 
        }

        /* ヘッダーの文字を中央揃え・改行対応（祝日名を表示するため） */
        .tabulator-col-title { 
            white-space: pre-wrap !important; 
            text-align: center; 
            line-height: 1.2 !important;
            font-size: 0.9em;
        }
        /* ヘッダーの「昼」「夜」などの文字サイズ調整 */
        .tabulator-col-title {
            line-height: 1.1 !important;
            font-size: 12px;
        }

        /* 2列並んだ時の視認性を上げるため、セルの左右の線を少し強調 */
        .sun-cell, .sat-cell {
            border-right: 1px solid #ddd !important;
        }

        /* ヘッダー全体を縦並びのFlexボックスにする */
        .tabulator-col-content {
            display: flex !important;
            flex-direction: column-reverse !important; /* 要素の順序を逆転させる（フィルターを上へ） */
            padding: 5px 0 !important;
        }

        /* フィルター（チェックボックス）エリアの調整 */
        .tabulator-header-filter {
            margin-bottom: 5px !important;
            background: transparent !important;
            border: none !important;
        }

        /* 日付・曜日のテキストエリア */
        .header-content-wrapper {
            line-height: 1.2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* チェックボックス自体の見た目 */
        .tabulator-header-filter input {
            width: 18px !important;
            height: 18px !important;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- <h1>当直表自動作成</h1> -->

    <div style="margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 15px; flex-wrap: wrap;">
        
        <div style="font-weight: bold;">
            <select id="select-year" style="font-size: 16px; padding: 5px;"></select> 年
            <select id="select-month" style="font-size: 16px; padding: 5px;"></select> 月
        </div>

        <button id="update-table-button" style="padding: 6px 12px; cursor: pointer;">表を更新</button>
        <button id="open-file-button" style="padding: 6px 12px; cursor: pointer;">Excelファイルを選択</button>
    </div>

    <div id="table-container"></div>

    <script src="./renderer.js"></script>
</body>
</html>
